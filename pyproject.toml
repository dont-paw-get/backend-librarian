[project]
name = "backend-librarian"
version = "0.1.0"
description = "동물 사서 캐릭터가 날씨/시간대에 어울리는 책을 추천하는 백엔드 에이전트"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strands-agents>=1.50,<2.0",
    "strands-agents-tools>=0.1,<1.0",
    "pydantic>=2.11,<3.0",
    "httpx>=0.28,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.11,<1.0",
    "respx>=0.22,<1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
