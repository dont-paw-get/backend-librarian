apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-librarian-config
  labels:
    app.kubernetes.io/name: backend-librarian
# 민감하지 않은 설정값만 여기에 둡니다.
# AWS Access Key / Secret Key 등 비밀값은 Secret 에 둡니다.
data:
  APP_ENV: "production"
  # Bedrock 사용 (Secret 으로 AWS 자격증명 주입). mock 으로 띄우려면 "" 로 비웁니다.
  USE_BEDROCK: "true"
  # 리전/모델 (app/librarian/agent.py 기본값과 일치)
  # 베어 모델 ID 는 ap-northeast-2 on-demand 호출이 거부되므로 global. 크로스리전
  # inference profile 을 쓴다 (전 리전 라우팅).
  AWS_REGION: "ap-northeast-2"
  AWS_DEFAULT_REGION: "ap-northeast-2"
  BEDROCK_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
