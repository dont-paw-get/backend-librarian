# ⚠️ 이 파일은 "예시" 입니다. 실제 비밀값을 여기에 적어 Git 에 커밋하지 마세요.
# ArgoCD Application 에서 *.example.yaml 은 제외하도록 설정되어 있습니다.
#
# 사서(librarian) 는 Bedrock 을 호출하므로 AWS 자격증명이 필요합니다.
# (EKS 에서 static Access Key 를 Secret 으로 주입하는 방식)
#
# 실제 Secret 생성 방법 (택 1):
#
# 1) kubectl 로 직접 생성 (가장 간단, 클러스터에만 존재하고 Git 에는 안 올라감)
#    kubectl create secret generic backend-librarian-secret \
#      --namespace dpyb-librarian-dev \
#      --from-literal=AWS_ACCESS_KEY_ID='AKIAxxxxxxxx' \
#      --from-literal=AWS_SECRET_ACCESS_KEY='xxxxxxxx'
#
#    # 임시 세션 자격증명(MFA/STS)을 쓰는 경우 아래도 함께:
#    #   --from-literal=AWS_SESSION_TOKEN='xxxxxxxx'
#
# 2) SealedSecrets / External Secrets Operator 를 써서 암호화된 형태로 Git 관리 (권장, 운영환경)
#    - SealedSecrets: kubeseal 로 암호화한 SealedSecret 을 커밋
#    - External Secrets: AWS Secrets Manager / SSM Parameter Store 와 연동
#    - (더 권장) EKS IRSA 로 static 키 없이 IAM Role 을 ServiceAccount 에 부여
#
# 아래는 참고용 구조입니다.
apiVersion: v1
kind: Secret
metadata:
  name: backend-librarian-secret
  namespace: dpyb-librarian-dev
  labels:
    app.kubernetes.io/name: backend-librarian
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "<aws-access-key-id>"
  AWS_SECRET_ACCESS_KEY: "<aws-secret-access-key>"
  # 임시 세션 자격증명(MFA/STS)을 쓰는 경우에만 지정
  # AWS_SESSION_TOKEN: "<aws-session-token>"
