apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 개발 환경 (develop 브랜치 → dpyb-librarian-dev 네임스페이스)
namespace: dpyb-librarian-dev

resources:
  - ../../base
  # dev 전용: infra Prometheus 가 /actuator/prometheus 를 스크레이핑하도록 하는 ServiceMonitor.
  # monitoring 스택은 dev 클러스터에만 있으므로 base 가 아닌 이 overlay 에 둔다.
  - servicemonitor.yaml

# 개발은 1개만
replicas:
  - name: backend-librarian
    count: 1

# 개발용 이미지. CI 가 newTag 를 커밋 SHA 로 갱신합니다.
images:
  - name: backend-librarian
    newName: 594532711953.dkr.ecr.ap-northeast-2.amazonaws.com/dpyb-dev/dpyb-librarian
    newTag: 88ca570f4a1687809c479d3d0493ed1c4dcab48b

# 개발 환경에서 달라지는 설정값만 덮어씀
patches:
  - path: configmap-patch.yaml
